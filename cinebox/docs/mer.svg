<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 1020" width="1260" height="1020" role="img" aria-label="CineBox · Modelo entidade-relacionamento">
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#e8eee5}.field{font-family:Consolas,monospace;font-size:13px}.box-title{font-size:19px;font-weight:650}.tag{font-size:10px;fill:#b9e66c}.relation{font-size:12px;fill:#b7c7b0;paint-order:stroke;stroke:#10171d;stroke-width:7px;stroke-linejoin:round}.multiplicity{font-size:12px;fill:#d7eabf;paint-order:stroke;stroke:#10171d;stroke-width:4px}</style>
<rect width="1260" height="1020" fill="#10171d"/><text x="40" y="45" font-size="28" font-weight="650">CineBox · Modelo entidade-relacionamento</text><text x="40" y="74" font-size="14" fill="#a4b6bc">7 tabelas relacionais · PK, FK, UK e cardinalidades</text>
<polyline points="340,205 460,205" fill="none" stroke="#91a786" stroke-width="1.7"/><text x="375" y="185" class="relation">escreve</text><text x="347" y="223" class="multiplicity">1</text><text x="420" y="223" class="multiplicity">0..*</text><polyline points="790,230 920,230" fill="none" stroke="#91a786" stroke-width="1.7"/><text x="825" y="210" class="relation">recebe</text><text x="799" y="250" class="multiplicity">0..*</text><text x="900" y="250" class="multiplicity">1</text><polyline points="190,411 190,530" fill="none" stroke="#91a786" stroke-width="1.7"/><text x="205" y="450" class="relation">cria</text><text x="202" y="432" class="multiplicity">1</text><text x="202" y="514" class="multiplicity">0..*</text><polyline points="340,590 460,590" fill="none" stroke="#91a786" stroke-width="1.7"/><text x="375" y="570" class="relation">contém</text><text x="350" y="610" class="multiplicity">1</text><text x="420" y="610" class="multiplicity">0..*</text><polyline points="790,640 855,640 855,350 920,350" fill="none" stroke="#91a786" stroke-width="1.7"/><text x="816" y="465" class="relation">integra</text><text x="800" y="660" class="multiplicity">0..*</text><text x="900" y="340" class="multiplicity">1</text><polyline points="1070,361 1070,530" fill="none" stroke="#91a786" stroke-width="1.7"/><text x="1090" y="465" class="relation">classifica</text><text x="1081" y="391" class="multiplicity">1</text><text x="1081" y="515" class="multiplicity">0..*</text><polyline points="1070,636 1070,760" fill="none" stroke="#91a786" stroke-width="1.7"/><text x="1090" y="700" class="relation">associa</text><text x="1081" y="661" class="multiplicity">0..*</text><text x="1081" y="746" class="multiplicity">1</text><g><rect x="40" y="130" width="300" height="281" rx="9" fill="#18252d" stroke="#4a5e63"/><path d="M40 179h300" stroke="#4a5e63"/><text x="58" y="160" class="box-title">usuarios</text><text x="325" y="160" class="tag" text-anchor="end">TABELA</text><text x="58" y="207" class="field">id BIGINT · PK</text><text x="58" y="232" class="field">nome VARCHAR(80)</text><text x="58" y="257" class="field">apelido VARCHAR(30) · UK</text><text x="58" y="282" class="field">email VARCHAR(120) · UK</text><text x="58" y="307" class="field">bio VARCHAR(300) · opcional</text><text x="58" y="332" class="field">data_cadastro DATE</text><text x="58" y="357" class="field">senha_hash VARCHAR(100) · opc.</text><text x="58" y="382" class="field">foto BLOB · opcional</text><text x="58" y="407" class="field">foto_tipo VARCHAR(20) · opc.</text></g><g><rect x="460" y="130" width="330" height="256" rx="9" fill="#18252d" stroke="#4a5e63"/><path d="M460 179h330" stroke="#4a5e63"/><text x="478" y="160" class="box-title">avaliacoes</text><text x="775" y="160" class="tag" text-anchor="end">UK (usuário, filme)</text><text x="478" y="207" class="field">id BIGINT · PK</text><text x="478" y="232" class="field">usuario_id BIGINT · FK</text><text x="478" y="257" class="field">filme_id BIGINT · FK</text><text x="478" y="282" class="field">nota DECIMAL(2,1)</text><text x="478" y="307" class="field">comentario VARCHAR(3000) · opc.</text><text x="478" y="332" class="field">data_assistido DATE</text><text x="478" y="357" class="field">favorito BOOLEAN</text><text x="478" y="382" class="field">spoiler BOOLEAN</text></g><g><rect x="920" y="130" width="300" height="231" rx="9" fill="#18252d" stroke="#4a5e63"/><path d="M920 179h300" stroke="#4a5e63"/><text x="938" y="160" class="box-title">filmes</text><text x="1205" y="160" class="tag" text-anchor="end">TABELA</text><text x="938" y="207" class="field">id BIGINT · PK</text><text x="938" y="232" class="field">titulo VARCHAR(140)</text><text x="938" y="257" class="field">diretor VARCHAR(100)</text><text x="938" y="282" class="field">ano_lancamento INTEGER</text><text x="938" y="307" class="field">duracao_minutos INTEGER</text><text x="938" y="332" class="field">sinopse VARCHAR(2000)</text><text x="938" y="357" class="field">capa VARCHAR(20)</text></g><g><rect x="40" y="530" width="300" height="156" rx="9" fill="#18252d" stroke="#4a5e63"/><path d="M40 579h300" stroke="#4a5e63"/><text x="58" y="560" class="box-title">listas</text><text x="325" y="560" class="tag" text-anchor="end">TABELA</text><text x="58" y="607" class="field">id BIGINT · PK</text><text x="58" y="632" class="field">usuario_id BIGINT · FK</text><text x="58" y="657" class="field">nome VARCHAR(100)</text><text x="58" y="682" class="field">descricao VARCHAR(1000) · opc.</text></g><g><rect x="460" y="530" width="330" height="181" rx="9" fill="#18252d" stroke="#4a5e63"/><path d="M460 579h330" stroke="#4a5e63"/><text x="478" y="560" class="box-title">itens_lista</text><text x="775" y="560" class="tag" text-anchor="end">UK (lista, filme)</text><text x="478" y="607" class="field">id BIGINT · PK</text><text x="478" y="632" class="field">lista_id BIGINT · FK</text><text x="478" y="657" class="field">filme_id BIGINT · FK</text><text x="478" y="682" class="field">posicao INTEGER</text><text x="478" y="707" class="field">observacao VARCHAR(300) · opc.</text></g><g><rect x="920" y="530" width="300" height="106" rx="9" fill="#18252d" stroke="#4a5e63"/><path d="M920 579h300" stroke="#4a5e63"/><text x="938" y="560" class="box-title">filme_genero</text><text x="1205" y="560" class="tag" text-anchor="end">JUNÇÃO N:N</text><text x="938" y="607" class="field">filme_id BIGINT · PK, FK</text><text x="938" y="632" class="field">genero_id BIGINT · PK, FK</text></g><g><rect x="920" y="760" width="300" height="106" rx="9" fill="#18252d" stroke="#4a5e63"/><path d="M920 809h300" stroke="#4a5e63"/><text x="938" y="790" class="box-title">generos</text><text x="1205" y="790" class="tag" text-anchor="end">TABELA</text><text x="938" y="837" class="field">id BIGINT · PK</text><text x="938" y="862" class="field">nome VARCHAR(40) · UK</text></g>
<path d="M40 910H1220" stroke="#35484e"/>
<text x="40" y="941" font-size="12" fill="#a4b6bc">PK = chave primária · FK = chave estrangeira · UK = unicidade · 1 = um · 0..* = zero ou muitos.</text><text x="40" y="965" font-size="12" fill="#a4b6bc">Unicidades compostas: avaliacoes(usuario_id, filme_id) e itens_lista(lista_id, filme_id).</text><text x="40" y="989" font-size="12" fill="#a4b6bc">filme_genero tem PK composta (filme_id, genero_id). Campos opcionais estão identificados; os demais são obrigatórios.</text>
</svg>