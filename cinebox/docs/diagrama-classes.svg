<path d="M40 910H1220" stroke="#35484e"/>
<text x="40" y="941" font-size="12" fill="#a4b6bc">1 = exatamente um · 0..* = zero ou muitos · 1..* = um ou muitos · ◆ = composição (lista → itens).</text><text x="40" y="965" font-size="12" fill="#a4b6bc">Unicidade: avaliação por pessoa + filme; item por lista + filme. Filme precisa de ao menos um gênero.</text><text x="40" y="989" font-size="12" fill="#a4b6bc">A associação Filme ↔ Genero é persistida na tabela de junção filme_genero.</text>
