spring.application.name=cinebox
server.address=127.0.0.1
server.port=${PORT:8080}
spring.datasource.url=jdbc:h2:file:./data/cinebox;DB_CLOSE_ON_EXIT=FALSE;WRITE_DELAY=0
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo
spring.h2.console.enabled=false
spring.thymeleaf.cache=false
server.error.include-message=never
server.error.include-stacktrace=never
spring.mvc.hiddenmethod.filter.enabled=false
app.dados-exemplo=true
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

# Autenticação por sessão local. Sem remember-me nem serviços externos.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
